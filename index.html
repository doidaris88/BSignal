<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Signal Fibo PWA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4">

    <header class="max-w-md mx-auto mb-4 flex justify-between items-center bg-slate-800/50 p-3 rounded-2xl border border-slate-700/40">
        <div>
            <h1 class="text-xl font-black text-amber-400 tracking-wide">⚡ BETA-SIGNAL LIVE</h1>
            <div class="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1">
                <span>Kurs Live:</span>
                <span id="live-rate" class="text-emerald-400 font-mono">Fetching...</span>
            </div>
        </div>
        <div class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-700">
            <button id="btn-usd" onclick="setCurrency('USD')" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition-all">USD</button>
            <button id="btn-idr" onclick="setCurrency('IDR')" class="px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400 transition-all">IDR</button>
        </div>
    </header>

    <main id="dashboard" class="max-w-md mx-auto space-y-4">
        </main>

    <script>
        // Memantau 5 aset High-Beta & Liquid teratas termasuk INJ
        const cryptos = [
            { id: 'sol', symbol: 'SOLUSDT', name: 'Solana' },
            { id: 'near', symbol: 'NEARUSDT', name: 'Near' },
            { id: 'avax', symbol: 'AVAXUSDT', name: 'Avalanche' },
            { id: 'doge', symbol: 'DOGEUSDT', name: 'Dogecoin' },
            { id: 'inj', symbol: 'INJUSDT', name: 'Injective' }
        ];

        let currentCurrency = 'USD';
        let usdToIdrRate = 16300; 

        const marketStats = {};
        cryptos.forEach(c => { marketStats[c.symbol] = { price: 0, high: 0, low: 0, vol: 0, prevVol: 0 }; });

        // Ambil Kurs Real-Time dari Pasaran Global Binance (USDTIDR)
        async function fetchRealtimeRate() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTIDR');
                const data = await response.json();
                if (data && data.price) {
                    usdToIdrRate = parseFloat(data.price);
                    document.getElementById('live-rate').innerText = 'Rp ' + usdToIdrRate.toLocaleString('id-ID', { maximumFractionDigits: 0 });
                }
            } catch (e) {
                console.log("Gagal memuat kurs live, menggunakan kurs internal:", e);
            }
        }
        
        fetchRealtimeRate();
        setInterval(fetchRealtimeRate, 300000); // Sinkronisasi otomatis setiap 5 menit

        function setCurrency(currency) {
            currentCurrency = currency;
            const btnUsd = document.getElementById('btn-usd');
            const btnIdr = document.getElementById('btn-idr');
            if(currency === 'USD') {
                btnUsd.className = "px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-500 text-slate-950";
                btnIdr.className = "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400";
            } else {
                btnIdr.className = "px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-500 text-slate-950";
                btnUsd.className = "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400";
            }
        }

        function formatValue(val, isPrice = true) {
            if (!isPrice) return val.toFixed(2);
            if (currentCurrency === 'IDR') {
                const idrVal = val * usdToIdrRate;
                return 'Rp ' + idrVal.toLocaleString('id-ID', { maximumFractionDigits: 0 });
            }
            return '$' + val.toLocaleString('en-US', { minimumFractionDigits: val < 1 ? 4 : 2, maximumFractionDigits: val < 1 ? 4 : 2 });
        }

        // Render struktur komponen UI dasar Dashboard PWA
        const dashboard = document.getElementById('dashboard');
        cryptos.forEach(coin => {
            dashboard.innerHTML += `
                <div id="card-${coin.id}" class="bg-slate-800 rounded-2xl p-4 border border-slate-700/50 shadow-xl transition-all duration-150">
                    <div class="flex justify-between items-center mb-3">
                        <div>
                            <h2 class="text-base font-bold">${coin.name} <span class="text-xs text-slate-500">${coin.symbol.replace('USDT','')}</span></h2>
                            <div class="text-lg font-mono font-black text-slate-300 mt-0.5" id="price-${coin.id}">$0.00</div>
                        </div>
                        <div class="text-right">
                            <div id="badge-${coin.id}" class="px-2.5 py-1 rounded-xl font-black text-xs bg-slate-700 text-slate-400">CONNECTING</div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-4 gap-1.5 bg-slate-900/60 p-3 rounded-xl border border-slate-700/30 font-mono text-center mb-1">
                        <div>
                            <div class="text-[8px] text-slate-500 font-sans uppercase font-bold">Entry (Live)</div>
                            <div class="text-xs font-bold text-amber-400 mt-0.5" id="entry-${coin.id}">-</div>
                        </div>
                        <div>
                            <div class="text-[8px] text-rose-400 font-sans uppercase font-bold">Stop Loss</div>
                            <div class="text-xs font-bold text-rose-500 mt-0.5" id="sl-${coin.id}">-</div>
                        </div>
                        <div>
                            <div class="text-[8px] text-emerald-400 font-sans uppercase font-bold">TP 1 (38.2%)</div>
                            <div class="text-xs font-bold text-emerald-400 mt-0.5" id="tp1-${coin.id}">-</div>
                        </div>
                        <div>
                            <div class="text-[8px] text-cyan-400 font-sans uppercase font-bold">TP 2 (61.8%)</div>
                            <div class="text-xs font-bold text-cyan-400 mt-0.5" id="tp2-${coin.id}">-</div>
                        </div>
                    </div>
                </div>
            `;
        });

        // Membuka interaksi pipa kilat data gabungan WebSocket
        const streams = cryptos.map(c => `${c.symbol.toLowerCase()}@miniTicker`).join('/');
        const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${streams}`);

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const symbol = msg.s;
            const coin = cryptos.find(c => c.symbol === symbol);
            if (!coin) return;

            const closePrice = parseFloat(msg.c);
            const highPrice = parseFloat(msg.h);
            const lowPrice = parseFloat(msg.l);
            const volume = parseFloat(msg.v);

            const stats = marketStats[symbol];
            stats.prevVol = stats.vol > 0 ? stats.vol : volume;
            stats.price = closePrice;
            stats.high = highPrice;
            stats.low = lowPrice;
            stats.vol = volume;

            document.getElementById(`price-${coin.id}`).innerText = formatValue(closePrice);

            // --- EKSEKUSI LOGIKA IMPLAN SINYAL DAN INTEGRASI FIBONACCI ---
            const range = highPrice - lowPrice || closePrice * 0.015;
            const midPoint = (highPrice + lowPrice) / 2;

            // Batas toleransi area jenuh mendatar (Sideways Zone)
            const neutralZoneUpper = midPoint + (range * 0.05);
            const neutralZoneLower = midPoint - (range * 0.05);

            const isVolSurge = volume > (stats.prevVol * 1.05); 

            let finalAction = "HOLD / NEUTRAL";
            let entry = closePrice;
            let sl = 0, tp1 = 0, tp2 = 0;

            if (closePrice > neutralZoneUpper) {
                // Zona Atas (Tren Bullish)
                if (isVolSurge && closePrice > (highPrice - (range * 0.15))) {
                    finalAction = "STRONG BUY";
                } else {
                    finalAction = "BUY";
                }
                
                // Rumus Target Profit Berbasis Fibonacci Golden Ratio (Arah Naik)
                sl = entry - (range * 0.236);       // Stop loss di area support Fibo 23.6% harian
                tp1 = entry + (range * 0.382);     // TP1 di proyeksi Golden Ratio Fibo 38.2%
                tp2 = entry + (range * 0.618);     // TP2 di target akselerasi Fibo 61.8%
                
            } else if (closePrice < neutralZoneLower) {
                // Zona Bawah (Tren Bearish)
                finalAction = "SELL";
                
                // Rumus Target Profit Berbasis Fibonacci Golden Ratio (Arah Turun/Short)
                sl = entry + (range * 0.236); 
                tp1 = entry - (range * 0.382);
                tp2 = entry - (range * 0.618);
                
            } else {
                // Zona Tengah (Sideways / Konsolidasi)
                finalAction = "HOLD / NEUTRAL";
                
                // Pasang kalkulasi seimbang default
                sl = entry - (range * 0.236);
                tp1 = entry + (range * 0.382);
                tp2 = entry + (range * 0.618);
            }

            // --- RE-RENDER TAMPILKAN STATUS PADA LAYAR UTAMA PWA ---
            const badge = document.getElementById(`badge-${coin.id}`);
            const card = document.getElementById(`card-${coin.id}`);

            if (finalAction === "STRONG BUY") {
                badge.className = "px-2.5 py-1 rounded-xl font-black text-xs bg-purple-600 text-white animate-pulse shadow-md shadow-purple-500/20";
                badge.innerText = "⚡ STRONG BUY";
                card.className = "bg-slate-800 rounded-2xl p-4 border border-purple-500/40 shadow-xl shadow-purple-950/20";
            } else if (finalAction === "BUY") {
                badge.className = "px-2.5 py-1 rounded-xl font-black text-xs bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/10";
                badge.innerText = "🟢 BUY";
                card.className = "bg-slate-800 rounded-2xl p-4 border border-emerald-500/30 shadow-xl shadow-emerald-950/10";
            } else if (finalAction === "SELL") {
                badge.className = "px-2.5 py-1 rounded-xl font-black text-xs bg-rose-600 text-white shadow-md shadow-rose-500/10";
                badge.innerText = "🔴 SELL";
                card.className = "bg-slate-800 rounded-2xl p-4 border border-rose-500/40 shadow-xl shadow-rose-950/10";
            } else {
                badge.className = "px-2.5 py-1 rounded-xl font-black text-xs bg-slate-700 text-slate-400 border border-slate-600/30";
                badge.innerText = "⚪ HOLD / NEUTRAL";
                card.className = "bg-slate-800 rounded-2xl p-4 border border-slate-700/50 shadow-xl";
            }

            // Cetak nilai data konversi angka real-time ke layar komponen grid PWA
            document.getElementById(`entry-${coin.id}`).innerText = formatValue(entry);
            document.getElementById(`sl-${coin.id}`).innerText = formatValue(sl);
            document.getElementById(`tp1-${coin.id}`).innerText = formatValue(tp1);
            document.getElementById(`tp2-${coin.id}`).innerText = formatValue(tp2);
        };

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
